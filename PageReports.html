<section aria-labelledby="fr-title">
  <h1 id="fr-title" class="text-xl font-semibold">ภาพรวมและรายงาน</h1>
  <form id="fr-filters" class="mt-4 grid grid-cols-2 gap-3 rounded-xl bg-white p-4 sm:grid-cols-3">
    <label class="field-label">เดือน <input class="field-input" name="month" type="month"></label>
    <label class="field-label">ปี ค.ศ. (เมื่อไม่ระบุเดือน) <input class="field-input" name="year" type="number" min="1900" max="2200"></label>
    <label class="field-label">เจ้าของรายการ <select class="field-input" name="owner_id"></select></label>
    <label class="field-label">หมวดหมู่ <select class="field-input" name="category_id"></select></label>
    <label class="field-label">บัญชีหรือบัตร <select class="field-input" name="account_id"></select></label>
    <button class="btn btn-primary self-end" type="submit">แสดงรายงาน</button>
  </form>
  <p id="fr-status" role="status" class="mt-3 text-sm text-slate-600"></p>
  <div id="fr-content" class="space-y-4"></div>
  <div class="mt-4 flex flex-wrap items-end gap-2 rounded-xl bg-white p-4">
    <label class="field-label">ชุดข้อมูล CSV
      <select class="field-input" id="fr-export-kind">
        <option value="TRANSACTIONS">ธุรกรรมจริง</option>
        <option value="SAVING">แผนเก็บเงิน</option>
        <option value="PAYMENT">แผนชำระ</option>
      </select>
    </label>
    <button type="button" class="btn btn-secondary" id="fr-download">ดาวน์โหลด CSV</button>
  </div>
</section>

<script>
  (function () {
    var el = App.el;
    var form = document.getElementById('fr-filters');
    var content = document.getElementById('fr-content');
    var status = document.getElementById('fr-status');
    var download = document.getElementById('fr-download');
    var activeFilters = null;
    var requestSeq = 0;
    var chartLibrary = null;
    var instances = [];
    var startDate = App.todayIso();
    form.elements.namedItem('month').value = startDate.slice(0, 7);
    form.elements.namedItem('year').value = startDate.slice(0, 4);

    function money(value) { return App.formatMoney(value) + ' บาท'; }

    function select(name, rows) {
      var field = form.elements.namedItem(name);
      var old = field.value;
      field.textContent = '';
      field.appendChild(el('option', { value: '', text: 'ทั้งหมด' }));
      rows.forEach(function (row) {
        field.appendChild(el('option', { value: row[name], text: row[name.slice(0, -3) + '_name'] }));
      });
      field.value = rows.some(function (row) { return row[name] === old; }) ? old : '';
    }

    function section(title) {
      return el('section', { class: 'rounded-xl bg-white p-4' },
        el('h2', { class: 'mb-2 font-semibold', text: title }));
    }

    function chart(title, series) {
      var box = section(title);
      var max = series.reduce(function (m, row) { return Math.max(m, Math.abs(row.amount)); }, 1);
      var list = el('ul', { class: 'space-y-2' });
      series.forEach(function (row) {
        var bar = el('div', { class: 'h-2 rounded bg-indigo-500', 'aria-hidden': 'true' });
        bar.style.width = Math.abs(row.amount) / max * 100 + '%';
        list.appendChild(el('li', { class: 'text-sm' },
          el('p', { class: 'break-words', text: row.label + ' · ' + money(row.amount) }),
          el('div', { class: 'mt-1 rounded bg-slate-100' }, bar)));
      });
      box.appendChild(series.length ? list : el('p', { class: 'text-sm text-slate-500', text: 'ไม่มีรายการในช่วงที่เลือก' }));
      if (window.Chart && series.length) {
        var canvas = el('canvas', { 'aria-hidden': 'true' });
        var wrapper = el('div', { class: 'relative mb-3' }, canvas);
        wrapper.style.height = Math.min(420, Math.max(120, series.length * 24)) + 'px';
        box.insertBefore(wrapper, list);
        requestAnimationFrame(function () {
          if (!canvas.isConnected) return;
          instances.push(new window.Chart(canvas, {
            type: 'bar',
            data: { labels: series.map(function (row) { return row.label; }),
              datasets: [{ data: series.map(function (row) { return row.amount; }), backgroundColor: '#6366f1' }] },
            options: { maintainAspectRatio: false, animation: false, indexAxis: 'y', plugins: { legend: { display: false } } }
          }));
          list.className = 'sr-only';
        });
      }
      return box;
    }

    function render(data) {
      instances.forEach(function (instance) { instance.destroy(); });
      instances = [];
      content.textContent = '';
      var s = data.summary;
      var cards = [['รายรับ', s.income], ['รายจ่ายที่รับรู้', s.expense], ['รายรับหักรายจ่าย', s.net], ['กระแสเงินสดสุทธิ', s.cashFlow],
        ['กันเงินจริงสุทธิ', s.saved], ['ยังต้องเก็บเพิ่ม', s.needToSave], ['ยอดตามแผนชำระ', s.scheduled],
        ['ชำระจริงที่จัดสรร', s.paid], ['ค้างชำระในช่วง', s.outstanding], ['ค้างตามแผนทุกเดือน', s.planOutstanding]];
      var grid = el('div', { class: 'grid grid-cols-2 gap-2 sm:grid-cols-3' });
      cards.forEach(function (card) {
        grid.appendChild(el('div', { class: 'rounded-xl bg-white p-3' },
          el('p', { class: 'text-sm text-slate-600', text: card[0] }), el('p', { class: 'break-words font-semibold', text: money(card[1]) })));
      });
      content.appendChild(grid);
      var accounts = section('ยอดปัจจุบันของบัญชีและบัตร');
      var total = data.accountTotals;
      accounts.appendChild(el('p', { class: 'mb-2 break-words text-sm font-medium',
        text: 'สินทรัพย์ ' + money(total.assets) + ' · กันไว้ ' + money(total.reserved) +
          ' · ใช้ได้ ' + money(total.available) + ' · หนี้ ' + money(total.liabilities) }));
      data.accounts.forEach(function (a) {
        var values = a.isAsset ? 'ยอด ' + money(a.balance) + ' · กันไว้ ' + money(a.reserved) + ' · ใช้ได้ ' + money(a.available)
          : 'หนี้คงเหลือ ' + money(a.balance);
        accounts.appendChild(el('p', { class: 'break-words border-t border-slate-100 py-2 text-sm', text: a.name + ' · ' + values }));
      });
      content.appendChild(accounts);
      var monthly = [];
      data.monthly.forEach(function (r) {
        monthly.push({ label: r.month + ' รายรับ', amount: r.income }, { label: r.month + ' รายจ่าย', amount: r.expense });
      });
      content.appendChild(chart('รายรับและรายจ่ายตามเดือน', monthly));
      content.appendChild(chart('รายจ่ายตามหมวด', data.categories.map(function (r) { return { label: r.name, amount: r.amount }; })));
      var recent = section('รายการล่าสุด');
      data.recent.forEach(function (r) {
        recent.appendChild(el('p', { class: 'break-words border-t border-slate-100 py-2 text-sm',
          text: [App.formatDateTh(r.transaction_date), r.item_name, money(r.amount)].join(' · ') }));
      });
      if (!data.recent.length) recent.appendChild(el('p', { class: 'text-sm text-slate-500', text: 'ไม่มีรายการในช่วงที่เลือก' }));
      content.appendChild(recent);
    }

    function load() {
      var seq = ++requestSeq;
      var filters = Object.fromEntries(new FormData(form));
      filters.month = filters.month.replace('-', '');
      download.disabled = true;
      status.textContent = 'กำลังโหลดรายงาน…';
      if (!chartLibrary) chartLibrary = new Promise(function (resolve) {
        var script = document.createElement('script');
        script.src = 'https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js';
        script.onload = script.onerror = resolve;
        document.head.appendChild(script);
      });
      return App.call('api_dashboard', filters).then(function (data) {
        if (seq !== requestSeq) return;
        select('owner_id', data.masters.owners);
        select('category_id', data.masters.categories);
        select('account_id', data.masters.accounts);
        render(data);
        if (!window.Chart) chartLibrary.then(function () {
          if (window.Chart && seq === requestSeq) render(data);
        });
        activeFilters = filters;
        status.textContent = '';
        download.disabled = false;
      }, function (err) {
        if (seq === requestSeq) status.textContent = err.message;
      });
    }

    form.addEventListener('submit', function (event) { event.preventDefault(); load(); });
    download.addEventListener('click', function () {
      var kind = document.getElementById('fr-export-kind').value;
      App.setBusy(download, true, 'กำลังเตรียมไฟล์…');
      App.call('api_exportFinanceReport', kind, activeFilters).then(function (csv) {
        var url = URL.createObjectURL(new Blob(['\uFEFF', csv], { type: 'text/csv;charset=utf-8' }));
        var link = el('a', { href: url, download: 'expense-' + kind.toLowerCase() + '.csv', target: '_self' });
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
      }, function (err) {
        status.textContent = err.message;
      }).finally(function () { App.setBusy(download, false); });
    });
    App.onShow('reports', load);
  })();
</script>
