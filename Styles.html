<style>
  /* ให้ attribute hidden ชนะ class display ของ Tailwind (grid/flex) */
  [hidden] { display: none !important; }

  /* ขนาดพื้นฐาน 15px (เดิม 16px): ทุกขนาดของ Tailwind/rem ลดลงตามสัดส่วนทั้งแอป */
  html { font-size: 15px; }
  /* ความกว้างหน้า: จอเล็ก/กลาง 64rem เท่าเดิม จอกว้างขยายเพื่อลดพื้นที่ว่างด้านข้าง (1920px ≈ 1560px) */
  .app-container { width: 100%; max-width: 64rem; }
  @media (min-width: 1280px) { .app-container { max-width: 80rem; } }
  @media (min-width: 1600px) { .app-container { max-width: 104rem; } }
  body { font-family: 'Sarabun', 'Noto Sans Thai', system-ui, -apple-system, 'Segoe UI', sans-serif; }

  /* header สีครามเข้มตัดกับพื้นหลังเนื้อหาสีอ่อน (คอนทราสต์ข้อความขาว/คราม-200 ผ่าน WCAG AA) */
  .app-header { background: #312e81; color: #fff; }
  .nav-item { display: inline-flex; align-items: center; min-height: 2.5rem; padding: 0 0.875rem; border-radius: 0.625rem; color: #e0e7ff; }
  .nav-item:hover { background: rgba(255, 255, 255, .12); color: #fff; }
  .app-header :where(a, button):focus-visible { outline-color: #fbbf24; }
  .nav-active, .nav-active:hover { background: #fff; color: #312e81; font-weight: 600; }
  .nav-disabled { color: #94a3b8; cursor: not-allowed; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.375rem; min-height: 2.75rem; padding: 0 1rem;
    border-radius: 0.75rem; font-size: 0.875rem; font-weight: 600; transition: background-color .15s, color .15s, opacity .15s; }
  .btn:disabled { opacity: .55; cursor: not-allowed; }
  .btn-primary { background: #4f46e5; color: #fff; }
  .btn-primary:hover:not(:disabled) { background: #4338ca; }
  .btn-secondary { background: #fff; color: #334155; border: 1px solid #cbd5e1; }
  .btn-secondary:hover:not(:disabled) { background: #f1f5f9; }
  .btn-danger { background: #e11d48; color: #fff; }
  .btn-danger:hover:not(:disabled) { background: #be123c; }
  .btn-ghost { background: transparent; color: #4f46e5; min-height: 2.5rem; padding: 0 .75rem; }
  .btn-ghost:hover:not(:disabled) { background: #eef2ff; }

  :where(a, button, input, select, textarea, [tabindex]):focus-visible { outline: 3px solid #a5b4fc; outline-offset: 2px; }

  .field-label { display: block; font-size: .875rem; font-weight: 500; color: #334155; margin-bottom: .25rem; }
  .field-input { width: 100%; min-height: 2.75rem; border: 1px solid #cbd5e1; border-radius: .75rem; padding: .5rem .75rem;
    background: #fff; font-size: 1rem; }
  /* จอสัมผัส: ช่องกรอกต้องไม่ต่ำกว่า 16px มิฉะนั้น iOS จะซูมหน้าเมื่อแตะช่อง */
  @media (pointer: coarse) { .field-input { font-size: 16px; } }
  /* เมาส์/ทัชแพด: dropdown ใช้ตัวอักษรเล็กกว่าช่องพิมพ์ (จอสัมผัสคง 16px ตามด้านบน) */
  @media (pointer: fine) { select.field-input { font-size: .875rem; } }
  .field-input:focus { border-color: #6366f1; outline: none; box-shadow: 0 0 0 3px #e0e7ff; }
  .field-input[aria-invalid="true"] { border-color: #e11d48; }
  .field-error { color: #be123c; font-size: .8125rem; margin-top: .25rem; }
  .field-hint { color: #64748b; font-size: .8125rem; margin-top: .25rem; }

  dialog::backdrop { background: rgba(15, 23, 42, .45); }

  .spinner { width: 1rem; height: 1rem; border-radius: 9999px; border: 2px solid currentColor; border-right-color: transparent;
    animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2s; } }

  .info-btn { display: inline-grid; place-items: center; flex: none; width: 1.75rem; height: 1.75rem; border-radius: 9999px;
    border: 1.5px solid #818cf8; color: #4338ca; background: #fff; font: italic 700 .875rem/1 Georgia, serif; vertical-align: middle; }
  .info-btn:hover, .info-btn[aria-expanded="true"] { background: #4f46e5; border-color: #4f46e5; color: #fff; }
  .info-panel { margin-top: .5rem; border: 1px solid #c7d2fe; border-radius: .75rem; background: #f8faff; padding: .75rem .875rem;
    font-size: .8125rem; color: #334155; text-align: left; font-weight: 400; }
  .info-title { font-weight: 600; color: #312e81; }
  .info-subtitle { margin-top: .5rem; font-weight: 600; color: #9a3412; }
  .info-points { margin-top: .25rem; padding-left: 1.1rem; list-style: disc; }
  .info-points li + li { margin-top: .125rem; }
  .info-fixes dt { margin-top: .375rem; font-weight: 600; color: #be123c; }
  .info-fixes dd { margin-left: .875rem; }
  .toast { pointer-events: auto; max-width: 28rem; width: 100%; border-radius: .875rem; padding: .75rem 1rem; font-size: .875rem;
    box-shadow: 0 10px 25px -10px rgba(15,23,42,.35); }
  .toast-success { background: #0f172a; color: #fff; }
  .toast-error { background: #be123c; color: #fff; }
  .toast-info { background: #4f46e5; color: #fff; }
</style>
