<style>
  body { font-family: 'Sarabun', 'Noto Sans Thai', system-ui, -apple-system, 'Segoe UI', sans-serif; }

  .nav-item { display: inline-flex; align-items: center; min-height: 2.5rem; padding: 0 0.875rem; border-radius: 0.625rem; }
  .nav-active { background: #eef2ff; color: #4338ca; font-weight: 600; }
  .nav-disabled { color: #94a3b8; cursor: not-allowed; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.375rem; min-height: 2.75rem; padding: 0 1rem;
    border-radius: 0.75rem; font-size: 0.875rem; font-weight: 600; transition: background-color .15s, color .15s, opacity .15s; }
  .btn:disabled { opacity: .55; cursor: not-allowed; }
  .btn-primary { background: #4f46e5; color: #fff; }
  .btn-primary:hover:not(:disabled) { background: #4338ca; }
  .btn-secondary { background: #fff; color: #334155; border: 1px solid #cbd5e1; }
  .btn-secondary:hover:not(:disabled) { background: #f1f5f9; }
  .btn-danger { background: #e11d48; color: #fff; }
  .btn-danger:hover:not(:disabled) { background: #be123c; }
  .btn-ghost { background: transparent; color: #4f46e5; min-height: 2.5rem; padding: 0 .75rem; }
  .btn-ghost:hover:not(:disabled) { background: #eef2ff; }

  :where(a, button, input, select, textarea, [tabindex]):focus-visible { outline: 3px solid #a5b4fc; outline-offset: 2px; }

  .field-label { display: block; font-size: .875rem; font-weight: 500; color: #334155; margin-bottom: .25rem; }
  .field-input { width: 100%; min-height: 2.75rem; border: 1px solid #cbd5e1; border-radius: .75rem; padding: .5rem .75rem;
    background: #fff; font-size: 1rem; }
  .field-input:focus { border-color: #6366f1; outline: none; box-shadow: 0 0 0 3px #e0e7ff; }
  .field-input[aria-invalid="true"] { border-color: #e11d48; }
  .field-error { color: #be123c; font-size: .8125rem; margin-top: .25rem; }
  .field-hint { color: #64748b; font-size: .8125rem; margin-top: .25rem; }

  dialog::backdrop { background: rgba(15, 23, 42, .45); }

  .spinner { width: 1rem; height: 1rem; border-radius: 9999px; border: 2px solid currentColor; border-right-color: transparent;
    animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2s; } }

  .toast { pointer-events: auto; max-width: 28rem; width: 100%; border-radius: .875rem; padding: .75rem 1rem; font-size: .875rem;
    box-shadow: 0 10px 25px -10px rgba(15,23,42,.35); }
  .toast-success { background: #0f172a; color: #fff; }
  .toast-error { background: #be123c; color: #fff; }
  .toast-info { background: #4f46e5; color: #fff; }
</style>
